# CI/CD: on every push, a fresh Linux machine checks the code with ruff and runs the tests in tests/.
# On main, if they pass, it deploys to Cloud Run.
#
# test: installs what the server installs (no ingest / eval / local groups) plus pytest, so a test that
#   only passes because of something on the Mac fails here. Evals are not run: they need the private
#   store and paid API keys, and take minutes.
# deploy: logs in to Google with Workload Identity Federation: GitHub's short-lived ID token for this run
#   is swapped for a short-lived Google token. No key file is stored anywhere. Google trusts only this
#   repo's main branch (the provider's condition), and the github-deployer service account can only
#   deploy from source (plans/deploy_journey.md, "Automatic deploys").
name: CI

on:
  push:
    paths-ignore:  # notes and evals only: the app is the same, so nothing to test or deploy
      - "**.md"
      - "plans/**"
      - "Evaluations/**"
      - "eval_results/**"
      - "experiments/**"
      - "archive/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3  # exact: setup-uv has no moving v10 tag; v6 ran on deprecated Node 20
        with:
          version: "0.13.9"  # same uv as the Mac and the Dockerfile (pyproject required-version)
          enable-cache: true  # packages (torch is the big one) come from cache after the first run
      - run: uv sync --locked --no-default-groups --group dev  # --locked: fail if uv.lock is out of date
      - run: uvx ruff@0.17.5 check .  # pinned, so a new ruff can't change the rules under us
      - run: uv run pytest -v

  deploy:
    needs: test                          # only after the tests pass
    if: github.ref == 'refs/heads/main'  # only main; Google's provider condition checks this too
    runs-on: ubuntu-latest
    concurrency: deploy                  # two quick pushes deploy one after the other, not together
    permissions:
      contents: read
      id-token: write                    # lets this job ask GitHub for its ID token; the test job can't
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/312655771959/locations/global/workloadIdentityPools/github/providers/taxowl-repo
          service_account: github-deployer@taxowl-515202.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      # Same command as a deploy from the Mac. Memory, CPU, env vars and secrets are kept on the service.
      - run: gcloud run deploy taxowl --source . --region us-central1 --project taxowl-515202 --quiet
