[project]
name = "taxowl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akash Aggarwal" }
]
requires-python = ">=3.14"
# Exact versions: these are what the scores in plans/extraction_journey.md were measured with.
# The same OCR scored 84% or 74% depending only on docling-core / docling-ibm-models versions
# (2026-11-02), so those two are pinned here too, not just in uv.lock.
#
# Split by job, so the server installs only what the app needs:
#   dependencies  -> the app (app.py): retrieve + answer. The server runs `uv sync --no-default-groups`.
#   ingest        -> reading PDFs (extract, OCR, split)
#   eval          -> the judges in src/taxowl/evals/ and src/taxowl/jev.py
#   local         -> the local answer model (Ollama); the server has no Ollama
# On the Mac, plain `uv sync` installs all of them (default-groups below), as before.
dependencies = [
    "chromadb==1.5.9",  # the store (src/taxowl/retrieval/store.py)
    "huggingface-hub==1.16.1",  # the server downloads the store from a private dataset (store.py ensure_store)
    "langchain-chroma==1.1.0",  # the store (src/taxowl/retrieval/store.py)
    "langchain-core==1.7.6",
    "langchain-huggingface==1.2.3",  # bge-m3 / bge-small vectors (src/taxowl/retrieval/embedder.py)
    "langchain-openrouter==0.2.9",  # cloud answer model (src/taxowl/answer/generator.py)
    "langchain-tavily>=0.2.18",  # web search for rates (src/taxowl/answer/web.py)
    "onnxruntime==1.31.0",  # chromadb needs it; pinned for RapidOCR's scores too
    "sentence-transformers==6.2.0",  # bge-m3 / bge-small vectors (src/taxowl/retrieval/embedder.py)
    "streamlit==1.66.0",  # the UI (app.py); same version as evals_project
    "tokenizers==0.22.2",  # bge-small's token counts in the splitter and chunker (src/taxowl/tokens.py)
    "torch==2.15.0",  # listed only so Linux can take the CPU-only build (see [tool.uv.sources])
]

[dependency-groups]
ingest = [
    "docling==2.99.0",  # scan pages: Docling + RapidOCR (src/taxowl/ingestion/ocr.py)
    "docling-core==2.105.0",
    "docling-ibm-models==3.15.0",
    "pymupdf==2.0",
    "rapidocr==3.10.0",
]
eval = [
    "deepeval==4.3.0",  # the judge in evals (src/taxowl/evals/); same version as evals_project
    "typesafe-sdk>=0.7.5",  # Jev (src/taxowl/jev.py)
]
local = [
    "langchain-ollama==1.1.0",  # local answer model (src/taxowl/answer/generator.py)
]

[tool.uv]
default-groups = ["ingest", "eval", "local"]  # Mac: `uv sync` = everything, as before

# Linux (the server) has no GPU: the normal Linux torch also pulls ~2-3 GB of NVIDIA packages.
# Take the CPU-only build there; the Mac keeps the normal one.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only torch comes from here, every other package from PyPI

[project.scripts]
taxowl = "taxowl:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
